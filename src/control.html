<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>SchuWebRosol</title>
<style>
  :root { color-scheme: dark; --bg:#16181d; --panel:#20232b; --line:#323743; --text:#e6e8ee; --dim:#9aa1b2; --accent:#4f8cff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .status { margin-left:auto; color:var(--dim); font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:5px; }
  .dot.ok { background:var(--ok); } .dot.err { background:var(--err); }
  main { padding:12px 14px; display:grid; gap:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  label { color:var(--dim); font-size:12px; }
  input[type=text], input[type=number], select, textarea { background:#111318; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:6px 8px; font:inherit; }
  textarea { width:100%; min-height:54px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; resize:vertical; }
  input[type=number] { width:80px; }
  #url { flex:1; min-width:240px; }
  button { background:#2b303b; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:10px 14px; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .check { display:flex; align-items:center; gap:6px; color:var(--text); font-size:13px; }
  #previewWrap { position:relative; background:#000; border-radius:6px; overflow:hidden; display:flex; justify-content:center; }
  #preview { max-width:100%; max-height:46vh; cursor:crosshair; display:block; image-rendering:auto; }
  #noPreview { color:var(--dim); padding:40px; }
  .hint { color:var(--dim); font-size:11px; }
  .err { color:var(--err); }
  details summary { cursor:pointer; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>SchuWebRosol</h1>
  <span id="badge" class="hint"></span>
  <span class="status"><span id="dot" class="dot"></span><span id="statusText">...</span></span>
</header>
<main>
  <div class="panel">
    <div class="row">
      <input id="url" type="text" placeholder="https://..." spellcheck="false">
      <button class="primary" id="go">Načíst</button>
      <button id="reload" title="Znovu načíst stránku (bez cache)">Reload</button>
    </div>
    <div id="error" class="err hint" style="margin-top:6px"></div>
  </div>

  <div class="panel">
    <div id="previewWrap"><img id="preview" alt="" hidden><div id="noPreview">Čekám na první snímek…</div></div>
    <div class="row" style="margin-top:8px">
      <span class="hint">Klik do náhledu = klik do stránky, kolečko = scroll.</span>
      <input id="typeText" type="text" placeholder="Napsat text do stránky…" style="flex:1;min-width:160px">
      <button id="typeBtn">Odeslat text</button>
      <button data-key="Enter">Enter</button>
      <button data-key="Tab">Tab</button>
      <button data-key="Backspace">⌫</button>
      <button data-key="Escape">Esc</button>
    </div>
  </div>

  <div class="panel">
    <div class="grid">
      <div class="field"><label>Název zdroje (Spout/Syphon)</label><input id="sender_name" type="text"></div>
      <div class="field"><label>Rozlišení</label>
        <select id="preset">
          <option value="1920x1080">1920 × 1080 (Full HD)</option>
          <option value="1280x720">1280 × 720</option>
          <option value="2560x1440">2560 × 1440</option>
          <option value="3840x2160">3840 × 2160 (4K)</option>
          <option value="1080x1920">1080 × 1920 (na výšku)</option>
          <option value="1024x768">1024 × 768</option>
          <option value="custom">Vlastní…</option>
        </select>
      </div>
      <div class="field"><label>Šířka × výška</label><div class="row"><input id="width" type="number" min="16" max="8192"> <input id="height" type="number" min="16" max="8192"></div></div>
      <div class="field"><label>FPS (max)</label><input id="fps" type="number" min="1" max="240"></div>
      <div class="field"><label>Zoom stránky (%)</label><input id="zoom_percent" type="number" min="25" max="500" step="5"></div>
      <div class="field"><label>Auto reload (s, 0 = vypnuto)</label><input id="reload_interval" type="number" min="0"></div>
      <label class="check"><input id="transparent" type="checkbox"> Průhledné pozadí (alpha)</label>
      <label class="check"><input id="mute" type="checkbox"> Ztlumit zvuk</label>
      <label class="check"><input id="hide_scrollbars" type="checkbox"> Skrýt posuvníky</label>
    </div>
    <details style="margin-top:10px">
      <summary>Vlastní CSS / JavaScript (aplikuje se po každém načtení)</summary>
      <div class="field" style="margin-top:8px"><label>CSS</label><textarea id="custom_css" spellcheck="false" placeholder="body { background: transparent !important; }"></textarea></div>
      <div class="field" style="margin-top:8px"><label>JavaScript</label><textarea id="custom_js" spellcheck="false" placeholder="document.querySelector('.cookie-banner')?.remove();"></textarea></div>
    </details>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="apply">Použít a uložit</button>
      <span id="saved" class="hint"></span>
      <span class="hint" style="margin-left:auto" id="configPath"></span>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fields = ['sender_name','width','height','fps','zoom_percent','reload_interval','transparent','mute','hide_scrollbars','custom_css','custom_js'];
let loaded = false;

async function api(path, body) {
  const opts = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
  const r = await fetch('/api/' + path, opts);
  return r.headers.get('content-type')?.includes('json') ? r.json() : r;
}

function fill(s) {
  $('url').value = s.url;
  for (const f of fields) {
    const el = $(f);
    if (el.type === 'checkbox') el.checked = !!s[f]; else el.value = s[f];
  }
  syncPreset();
}

function collect() {
  const s = { url: $('url').value.trim() };
  for (const f of fields) {
    const el = $(f);
    s[f] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value);
  }
  return s;
}

function syncPreset() {
  const v = $('width').value + 'x' + $('height').value;
  $('preset').value = [...$('preset').options].some(o => o.value === v) ? v : 'custom';
}

function normalizeUrl(u) {
  if (!u) return u;
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return u;
  return 'https://' + u;
}

async function apply(extra) {
  const s = Object.assign(collect(), extra || {});
  s.url = normalizeUrl(s.url);
  $('url').value = s.url;
  await api('settings', s);
  $('saved').textContent = 'Uloženo ' + new Date().toLocaleTimeString();
}

async function refreshState() {
  try {
    const st = await api('state');
    if (!loaded) { fill(st.settings); loaded = true; }
    $('badge').textContent = (st.backend || '') + ' · „' + st.settings.sender_name + '“' + (st.instance !== 'default' ? ' · instance ' + st.instance : '');
    const clients = st.clients < 0 ? '' : (st.clients > 0 ? ' · klient připojen' : ' · bez klienta');
    $('statusText').textContent = (st.loading ? 'Načítám… ' : '') + st.frame_width + '×' + st.frame_height + ' · ' + st.fps + ' fps' + clients;
    $('dot').className = 'dot ' + (st.last_error ? 'err' : 'ok');
    $('error').textContent = st.last_error ? 'Chyba: ' + st.last_error : '';
    $('configPath').textContent = st.config_path + ' · v' + st.version;
    if (document.activeElement !== $('url') && st.current_url && st.current_url !== $('url').dataset.last) {
      $('url').value = st.current_url;
      $('url').dataset.last = st.current_url;
    }
  } catch (e) { $('statusText').textContent = 'Nedostupné'; }
}

let previewUrl = null;
async function refreshPreview() {
  try {
    const r = await fetch('/api/preview.bmp?t=' + Date.now());
    if (r.status === 200) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      $('preview').src = url;
      $('preview').hidden = false;
      $('noPreview').hidden = true;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = url;
    }
  } catch (e) {}
  setTimeout(refreshPreview, 200);
}

$('go').onclick = () => apply();
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
$('reload').onclick = () => api('reload', {});
$('apply').onclick = () => apply();
$('preset').onchange = () => {
  const v = $('preset').value;
  if (v === 'custom') return;
  const [w, h] = v.split('x').map(Number);
  $('width').value = w; $('height').value = h;
};
$('width').oninput = $('height').oninput = syncPreset;
$('preview').addEventListener('click', e => {
  const r = e.target.getBoundingClientRect();
  api('click', { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
});
$('preview').addEventListener('wheel', e => { e.preventDefault(); api('scroll', { dy: Math.round(-e.deltaY) }); }, { passive:false });
$('typeBtn').onclick = () => { api('type', { text: $('typeText').value }); $('typeText').value = ''; };
$('typeText').addEventListener('keydown', e => { if (e.key === 'Enter') { $('typeBtn').click(); } });
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => api('key', { key: b.dataset.key }));

refreshState();
setInterval(refreshState, 1000);
refreshPreview();
</script>
</body>
</html>
